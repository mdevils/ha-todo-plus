        number:
          min: 1
          max: 12
          mode: box
    count:
      name: End after N occurrences (fixed)
      description: RRULE COUNT. Ends the schedule after N occurrences.
      selector:
        number:
          min: 1
          max: 9999
          mode: box
    until:
      name: End on date (fixed)
      description: RRULE UNTIL. Ends the schedule on this date.
      selector:
        date:
    start_date:
      name: Start date
      description: The schedule anchor. Defaults to the task's start or due date, else today.
      selector:
        date:

clear_recurrence:
  name: Clear recurrence
  description: Stop a task recurring. Existing occurrences are kept as plain tasks.
  target:
    entity:
      integration: todo_plus
      domain: todo
  fields:
    item:
      name: Task
      description: The task name (summary) or uid.
      selector:
        text:
    uid:
      name: Task uid
      selector:
        text:

set_start_date:
  name: Set start date
  description: Set (or clear) the start date of a task. The task is hidden until then.
  target:
    entity:
      integration: todo_plus
      domain: todo
  fields:
    item:
      name: Task
      description: The task name (summary) or uid.
      selector:
        text:
    uid:
      name: Task uid
      selector:
        text:
    start_date:
      name: Start date
      description: Leave empty to clear the start date.
      selector:
        date:

set_priority:
  name: Set priority
  description: Set the priority of a task (low, normal or high).
  target:
    entity:
      integration: todo_plus
      domain: todo
  fields:
    item:
      name: Task
      description: The task name (summary) or uid.
      selector:
        text:
    uid:
      name: Task uid
      selector:
        text:
    priority:
      name: Priority
      required: true
      default: normal
      selector:
        select:
          options:
            - low
            - normal
            - high

delete_task:
  name: Delete task
  description: Delete a task by name or uid.
  target:
    entity:
      integration: todo_plus
      domain: todo
  fields:
    item:
      name: Task
      description: The task name (summary) or uid.
      selector:
        text:
    uid:
      name: Task uid
      selector:
        text:

update_task:
  name: Update task
  description: >-
    Update a task's name, description, due date or status. Works on any task,
    including future-start ones hidden from the standard to-do list.
  target:
    entity:
      integration: todo_plus
      domain: todo
  fields:
    item:
      name: Task
      description: The task name (summary) or uid.
      selector:
        text:
    uid:
      name: Task uid
      selector:
        text:
    summary:
      name: Name
      description: New task name.
      selector:
        text:
    description:
      name: Description
      selector:
        text:
          multiline: true
    due_date:
      name: Due date
      selector:
        date:
    status:
      name: Status
      selector:
        select:
          options:
            - needs_action
            - completed
    assignee:
      name: Assignee
      description: Person responsible (free text). Leave empty to clear.
      selector:
        text:

set_assignee:
  name: Set assignee
  description: Set (or clear) who a task is assigned to.
  target:
    entity:
      integration: todo_plus
      domain: todo
  fields:
    item:
      name: Task
      description: The task name (summary) or uid.
      selector:
        text:
    uid:
      name: Task uid
      selector:
        text:
    assignee:
      name: Assignee
      description: Person responsible (free text). Leave empty to clear.
      example: Alice
      selector:
        text:

clear_completed:
  name: Clear completed
  description: Remove all completed tasks from a list.
  target:
    entity:
      integration: todo_plus
      domain: todo
